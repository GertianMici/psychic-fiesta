name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore PsychicFiesta.slnx

      - run: dotnet build PsychicFiesta.slnx --no-restore --configuration Release

      - run: dotnet test PsychicFiesta.slnx --no-build --configuration Release
